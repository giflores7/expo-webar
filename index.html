
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #quizOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

.quizCard {
  background: white;
  color: #222;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 20px;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
  text-align: center;
}

#closeQuiz {
  display: block;
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.quizCard h2 {
  margin-top: 5px;
}

.quizCard p {
  line-height: 1.5;
}

.answer {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #f5f5f5;
  font-size: 15px;
  cursor: pointer;
}
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets/targets.mind;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera -->
   <a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>

    <!-- Image target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Exhibition project 3D model -->
<a-entity
  id="projectModel"
  class="clickable"
  gltf-model="./assets/models/proyecto1.glb"
  position="0 0 0.3"
  rotation="0 180 0"
  scale="0.2 0.2 0.2">
</a-entity>

      <!-- Floating text -->
      <a-text
        value="Hello, Inventarium!"
        position="0 0.35 0.3"
        align="center"
        color="#FFFFFF"
        width="2">
      </a-text>

    </a-entity>

  </a-scene>
  <div id="quizOverlay">

  <div class="quizCard">

    <button id="closeQuiz">✕</button>

    <h2>Project 01</h2>

    <p>What problem does this project aim to solve?</p>

    <button class="answer">A. Reduce material waste</button>

    <button class="answer">B. Improve user comfort</button>

    <button class="answer">C. Save storage space</button>

    <p id="feedback"></p>

  </div>

</div>
<script>
  const scene = document.querySelector("a-scene");
  const projectModel = document.querySelector("#projectModel");

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  scene.addEventListener("renderstart", function () {

    const canvas = scene.renderer.domElement;

    canvas.addEventListener("pointerdown", function (event) {

      // Get the camera screen coordinates
      const rect = canvas.getBoundingClientRect();

      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;

      pointer.x = x * 2 - 1;
      pointer.y = -(y * 2 - 1);

      // Cast a ray from the camera
      raycaster.setFromCamera(pointer, scene.camera);

      // Check whether the ray hits the 3D model
      const intersections = raycaster.intersectObject(
        projectModel.object3D,
        true
      );

      if (intersections.length > 0) {
  document.getElementById("quizOverlay").style.display = "flex";
}

    });

  });
  // Close the quiz
document.getElementById("closeQuiz").addEventListener("click", function () {
  document.getElementById("quizOverlay").style.display = "none";
});

// Answer selection
const answers = document.querySelectorAll(".answer");
const feedback = document.getElementById("feedback");

answers.forEach(function (answer, index) {

  answer.addEventListener("click", function () {

    if (index === 0) {
      feedback.textContent = "Correct! Great job!";
      feedback.style.color = "green";
    } else {
      feedback.textContent = "Not quite! Try again.";
      feedback.style.color = "red";
    }

  });

});
</script>
</body>
</html>
