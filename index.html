
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
 
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div id="welcomeScreen">
  <div class="welcomeCard">
    <h1>¡Bienvenido a Inventarium!</h1>
    <p>Elige un nombre de usuario para unirte a la leaderboard.</p>

    <input
      type="text"
      id="nicknameInput"
      placeholder="Nombre de usuario"
      maxlength="20"
      autocomplete="nickname"
    >

    <button id="startButton" disabled>
      Loading...
    </button>

    <p id="welcomeError"></p>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets/targets.mind; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- PROJECT 1: TARGET INDEX 0 -->
  <a-entity
    id="project1Target"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="projectModel1"
      gltf-model="./assets/models/proyecto1.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>

  <!-- PROJECT 2: TARGET INDEX 1 -->
  <a-entity
    id="project2Target"
    mindar-image-target="targetIndex: 1">

    <a-entity
      id="projectModel2"
      gltf-model="./assets/models/proyecto2.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>
  <!-- PROJECT 3: TARGET INDEX 2 -->
  <a-entity
    id="project3Target"
   mindar-image-target="targetIndex: 2">

    <a-entity
     id="projectModel3"
      gltf-model="./assets/models/proyecto3.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

</a-entity>
</a-scene>
<div id="exhibitionProgress">
  <span id="progressText">Proyectos completados: 0/2</span>
  <span id="scoreText">Puntos: 0/2</span>
</div>

<button id="leaderboardButton">
Leaderboard 🏆 
</button>

<div id="leaderboardOverlay">
  <div class="leaderboardCard">
    <button id="closeLeaderboard">✕</button>

    <h2>Leaderboard</h2>
    <p>Mejores visitantes por puntos totales</p>

    <div id="leaderboardStatus">Cargando rankings...</div>
    <div id="leaderboardList"></div>
  </div>
</div>

  <div id="quizOverlay">

  <div class="quizCard" id="quizCard">

    <button id="closeQuiz">✕</button>

    <p id="quizProgress"></p>

    <h2 id="quizTitle">Project 01</h2>

    <h3 id="questionText"></h3>

    <div id="answerContainer"></div>

    <p id="feedback"></p>

    <button id="nextButton" disabled>
      Continue
    </button>

  </div>

  <div class="quizCard" id="completionScreen" style="display:none;">
  <h2>¡Desafío completado!</h2>

  <p id="completionMessage">
    Has completado el desafío de este proyecto.
  </p>
  <button id="replayButton">Play again</button>
  <button id="finishButton">Return to AR</button>
</div>

</div>
<script src="./js/projects.js"></script>
<script src="./js/ar.js"></script>
<script type="module" src="./js/firebase.js"></script>
</body>
</html>
