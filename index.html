
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets/targets.mind;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera -->
   <a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>

    <!-- Image target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Exhibition project 3D model -->
<a-entity
  id="projectModel"
  class="clickable"
  gltf-model="./assets/models/proyecto1.glb"
  position="0 0 0.3"
  rotation="0 180 0"
  scale="0.2 0.2 0.2">
</a-entity>

      <!-- Floating text -->
      <a-text
        value="Hello, Inventarium!"
        position="0 0.35 0.3"
        align="center"
        color="#FFFFFF"
        width="2">
      </a-text>

    </a-entity>

  </a-scene>
<script>
  const scene = document.querySelector("a-scene");
  const projectModel = document.querySelector("#projectModel");

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  scene.addEventListener("renderstart", function () {

    const canvas = scene.renderer.domElement;

    canvas.addEventListener("pointerdown", function (event) {

      // Get the camera screen coordinates
      const rect = canvas.getBoundingClientRect();

      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;

      pointer.x = x * 2 - 1;
      pointer.y = -(y * 2 - 1);

      // Cast a ray from the camera
      raycaster.setFromCamera(pointer, scene.camera);

      // Check whether the ray hits the 3D model
      const intersections = raycaster.intersectObject(
        projectModel.object3D,
        true
      );

      if (intersections.length > 0) {
        alert("You discovered a Star!");
      }

    });

  });
</script>
</body>
</html>
