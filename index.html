
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #quizOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

.quizCard {
  background: white;
  color: #222;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 20px;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
  text-align: center;
}

#closeQuiz {
  display: block;
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.quizCard h2 {
  margin-top: 5px;
}

.quizCard p {
  line-height: 1.5;
}

.answer {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #f5f5f5;
  font-size: 15px;
  cursor: pointer;
}
#quizProgress {
  color: #888;
  font-size: 12px;
  letter-spacing: 1px;
}

#questionText {
  font-size: 19px;
  line-height: 1.4;
  margin: 20px 0;
}

#answerContainer {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.answer {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #f5f5f5;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}

.answer:disabled {
  opacity: 1;
  cursor: default;
}

.answer.correct {
  background: #d9f5df;
  border-color: #37a65b;
}

.answer.incorrect {
  background: #ffe0e0;
  border-color: #d94b4b;
}

#feedback {
  min-height: 24px;
  font-size: 14px;
  font-weight: bold;
}

#nextButton,
#replayButton,
#finishButton {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
}

#nextButton:disabled {
  opacity: 0.4;
}
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets/targets.mind;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera -->
   <a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>

    <!-- Image target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Exhibition project 3D model -->
<a-entity
  id="projectModel"
  class="clickable"
  gltf-model="./assets/models/proyecto1.glb"
  position="0 0 0.3"
  rotation="0 180 0"
  scale="0.2 0.2 0.2">
</a-entity>

      <!-- Floating text -->
      <a-text
        value="Hello, Inventarium!"
        position="0 0.35 0.3"
        align="center"
        color="#FFFFFF"
        width="2">
      </a-text>

    </a-entity>

  </a-scene>
  <div id="quizOverlay">

  <div class="quizCard" id="quizCard">

    <button id="closeQuiz">✕</button>

    <p id="quizProgress">QUESTION 1 OF 2</p>

    <h2 id="quizTitle">Project 01</h2>

    <h3 id="questionText"></h3>

    <div id="answerContainer"></div>

    <p id="feedback"></p>

    <button id="nextButton" disabled>
      Continue
    </button>

  </div>

  <div class="quizCard" id="completionScreen"
       style="display:none;">

    <h2>Congratulations!</h2>

    <p>You completed this project's challenge.</p>

    <button id="replayButton">Play again</button>

    <button id="finishButton">Return to AR</button>

  </div>

</div>

<script>
  const scene = document.querySelector("a-scene");
  const projectModel = document.querySelector("#projectModel");

  const overlay = document.getElementById("quizOverlay");
  const questionText = document.getElementById("questionText");
  const answerContainer = document.getElementById("answerContainer");
  const feedback = document.getElementById("feedback");
  const progress = document.getElementById("quizProgress");
  const nextButton = document.getElementById("nextButton");

  const completionScreen =
    document.getElementById("completionScreen");

  // PROJECT 01 QUESTIONS
  const questions = [

    {
      question: "What problem does this project aim to solve?",

      answers: [
        {
          text: "Reduce material waste",
          correct: true
        },
        {
          text: "Improve user comfort",
          correct: false
        },
        {
          text: "Save storage space",
          correct: false
        }
      ],

      explanation: "Correct! You discovered the project's main purpose."
    },

    {
      question: "Which design aspect is most important in this project?",

      answers: [
        {
          text: "Functionality",
          correct: true
        },
        {
          text: "Decoration",
          correct: false
        },
        {
          text: "Packaging",
          correct: false
        }
      ],

      explanation: "Great job! You completed both questions."
    }

  ];

  let currentQuestion = 0;
  let answered = false;

  // SHOW A QUESTION
  function showQuestion() {

    answered = false;

    const question = questions[currentQuestion];

    progress.textContent =
      "QUESTION " + (currentQuestion + 1) +
      " OF " + questions.length;

    questionText.textContent = question.question;

    answerContainer.innerHTML = "";

    feedback.textContent = "";

    nextButton.disabled = true;

    question.answers.forEach(function(answer) {

      const button = document.createElement("button");

      button.className = "answer";
      button.textContent = answer.text;

      button.addEventListener("click", function() {

        if (answered) return;

        answered = true;

        const allAnswers =
          answerContainer.querySelectorAll(".answer");

        allAnswers.forEach(function(button) {
          button.disabled = true;
        });

        if (answer.correct) {

          button.classList.add("correct");

          feedback.textContent = question.explanation;
          feedback.style.color = "green";

        } else {

          button.classList.add("incorrect");

          feedback.textContent =
            "Not quite! The correct answer is: " +
            question.answers.find(a => a.correct).text;

          feedback.style.color = "red";

          allAnswers.forEach(function(otherButton, index) {
            if (question.answers[index].correct) {
              otherButton.classList.add("correct");
            }
          });

        }

        nextButton.disabled = false;

      });

      answerContainer.appendChild(button);

    });

    nextButton.textContent =
      currentQuestion === questions.length - 1
        ? "Finish"
        : "Continue";

  }

  // OPEN QUIZ
  function openQuiz() {

    if (overlay.style.display === "flex") return;

    currentQuestion = 0;

    document.getElementById("quizCard").style.display = "block";
    completionScreen.style.display = "none";

    overlay.style.display = "flex";

    showQuestion();

  }

  // NEXT QUESTION
  nextButton.addEventListener("click", function() {

    if (!answered) return;

    if (currentQuestion < questions.length - 1) {

      currentQuestion++;

      showQuestion();

    } else {

      document.getElementById("quizCard").style.display = "none";

      completionScreen.style.display = "block";

    }

  });

  // CLOSE QUIZ
  function closeQuiz() {
    overlay.style.display = "none";
  }

  document.getElementById("closeQuiz")
    .addEventListener("click", closeQuiz);

  document.getElementById("finishButton")
    .addEventListener("click", closeQuiz);

  // REPLAY
  document.getElementById("replayButton")
    .addEventListener("click", function() {

      currentQuestion = 0;

      completionScreen.style.display = "none";
      document.getElementById("quizCard").style.display = "block";

      showQuestion();

    });

  // DETECT TOUCH ON 3D MODEL
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  scene.addEventListener("renderstart", function() {

    const canvas = scene.renderer.domElement;

    canvas.addEventListener("pointerdown", function(event) {

      // Ignore taps while quiz is open
      if (overlay.style.display === "flex") return;

      const rect = canvas.getBoundingClientRect();

      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;

      pointer.x = x * 2 - 1;
      pointer.y = -(y * 2 - 1);

      raycaster.setFromCamera(pointer, scene.camera);

      const intersections = raycaster.intersectObject(
        projectModel.object3D,
        true
      );

      if (intersections.length > 0) {
        openQuiz();
      }

    });

  });

</script>
</body>
</html>
