
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #quizOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

.quizCard {
  background: #FAEADD;
  color: #222023;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 20px;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
  text-align: center;
}

#closeQuiz {
  display: block;
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.quizCard h2 {
  margin-top: 5px;
}

.quizCard p {
  line-height: 1.5;
}

.answer {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #DDAAFF;
  border-radius: 10px;
  background: #522A6F;
  font-size: 15px;
  cursor: pointer;
}
#quizProgress {
  color: #DDAAFF;
  font-size: 12px;
  letter-spacing: 1px;
}

#questionText {
  font-size: 19px;
  line-height: 1.4;
  margin: 20px 0;
}

#answerContainer {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.answer {
  width: 100%;
  padding: 14px;
  border: 1px solid #DDAAFF;
  border-radius: 10px;
  background: #522A6F;
  color: white;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}

.answer:disabled {
  opacity: 1;
  cursor: default;
}

.answer.correct {
  background: #37a65b;
  border-color: #d9f5df;
}

.answer.incorrect {
  background: #d94b4b;
  border-color: #ffe0e0;
}

#feedback {
  min-height: 24px;
  font-size: 14px;
  font-weight: bold;
}

#nextButton,
#replayButton,
#finishButton {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background:   #FBCF4F;
  color: #222023;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
}

#nextButton:disabled {
  opacity: 0.4;
}
#exhibitionProgress {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;

  display: flex;
  gap: 15px;
  align-items: center;

  padding: 10px 16px;
  border-radius: 30px;

  background: rgba(255,255,255,0.92);
  color: #222;

  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;

  white-space: nowrap;
  pointer-events: none;
}

#completionMessage {
  line-height: 1.5;
  margin: 20px 0;
}
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets/targets.mind; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- PROJECT 1: TARGET INDEX 0 -->
  <a-entity
    id="project1Target"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="projectModel1"
      gltf-model="./assets/models/proyecto1.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>

  <!-- PROJECT 2: TARGET INDEX 1 -->
  <a-entity
    id="project2Target"
    mindar-image-target="targetIndex: 1">

    <a-entity
      id="projectModel2"
      gltf-model="./assets/models/proyecto2.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>
  <!-- PROJECT 3: TARGET INDEX 2 -->
  <a-entity
    id="project3Target"
   mindar-image-target="targetIndex: 2">

    <a-entity
     id="projectModel3"
      gltf-model="./assets/models/proyecto3.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

</a-entity>
</a-scene>
<div id="exhibitionProgress">
  <span id="progressText">Projects completed: 0/2</span>
  <span id="scoreText">Points: 0/2</span>
</div>
  <div id="quizOverlay">

  <div class="quizCard" id="quizCard">

    <button id="closeQuiz">✕</button>

    <p id="quizProgress"></p>

    <h2 id="quizTitle">Project 01</h2>

    <h3 id="questionText"></h3>

    <div id="answerContainer"></div>

    <p id="feedback"></p>

    <button id="nextButton" disabled>
      Continue
    </button>

  </div>

  <div class="quizCard" id="completionScreen" style="display:none;">
  <h2>Challenge completed!</h2>

  <p id="completionMessage">
    You completed this project's challenge.
  </p>
  <button id="replayButton">Play again</button>
  <button id="finishButton">Return to AR</button>
</div>

</div>
<script src="./js/projects.js"></script>
<script src="./js/ar.js"></script>
</body>
</html>
