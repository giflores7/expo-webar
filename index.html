
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #quizOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

.quizCard {
  background: #FAEADD;
  color: #222023;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 20px;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
  text-align: center;
}

#closeQuiz {
  display: block;
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.quizCard h2 {
  margin-top: 5px;
}

.quizCard p {
  line-height: 1.5;
}

.answer {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #DDAAFF;
  border-radius: 10px;
  background: #522A6F;
  font-size: 15px;
  cursor: pointer;
}
#quizProgress {
  color: #DDAAFF;
  font-size: 12px;
  letter-spacing: 1px;
}

#questionText {
  font-size: 19px;
  line-height: 1.4;
  margin: 20px 0;
}

#answerContainer {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.answer {
  width: 100%;
  padding: 14px;
  border: 1px solid #DDAAFF;
  border-radius: 10px;
  background: #522A6F;
  color: white;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}

.answer:disabled {
  opacity: 1;
  cursor: default;
}

.answer.correct {
  background: #37a65b;
  border-color: #d9f5df;
}

.answer.incorrect {
  background: #d94b4b;
  border-color: #ffe0e0;
}

#feedback {
  min-height: 24px;
  font-size: 14px;
  font-weight: bold;
}

#nextButton,
#replayButton,
#finishButton {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background:   #FBCF4F;
  color: #222023;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
}

#nextButton:disabled {
  opacity: 0.4;
}
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets/targets.mind; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- PROJECT 1: TARGET INDEX 0 -->
  <a-entity
    id="project1Target"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="projectModel1"
      gltf-model="./assets/models/proyecto1.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>

  <!-- PROJECT 2: TARGET INDEX 1 -->
  <a-entity
    id="project2Target"
    mindar-image-target="targetIndex: 1">

    <a-entity
      id="projectModel2"
      gltf-model="./assets/models/proyecto2.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

  </a-entity>
  <!-- PROJECT 3: TARGET INDEX 2 -->
  <a-entity
    id="project3Target"
   mindar-image-target="targetIndex: 2">

    <a-entity
     id="projectModel3"
      gltf-model="./assets/models/proyecto3.glb"
      position="0 0 0.3"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-entity>

</a-entity>
</a-scene>
  <div id="quizOverlay">

  <div class="quizCard" id="quizCard">

    <button id="closeQuiz">✕</button>

    <p id="quizProgress">QUESTION 1 OF 2</p>

    <h2 id="quizTitle">Project 01</h2>

    <h3 id="questionText"></h3>

    <div id="answerContainer"></div>

    <p id="feedback"></p>

    <button id="nextButton" disabled>
      Continue
    </button>

  </div>

  <div class="quizCard" id="completionScreen"
       style="display:none;">

    <h2>Congratulations!</h2>

    <p>You completed this project's challenge.</p>

    <button id="replayButton">Play again</button>

    <button id="finishButton">Return to AR</button>

  </div>

</div>

<script>
  const scene = document.querySelector("a-scene");

  // QUIZ INTERFACE ELEMENTS
  const overlay = document.getElementById("quizOverlay");
  const questionText = document.getElementById("questionText");
  const answerContainer = document.getElementById("answerContainer");
  const feedback = document.getElementById("feedback");
  const progress = document.getElementById("quizProgress");
  const nextButton = document.getElementById("nextButton");
  const quizTitle = document.getElementById("quizTitle");

  const quizCard = document.getElementById("quizCard");
  const completionScreen =
    document.getElementById("completionScreen");

  // PROJECT-SPECIFIC CONTENT
  const projects = {
    project1: {
      title: "Project 01",
      model: document.getElementById("projectModel1"),
      target: document.getElementById("project1Target"),
      questions: [
        {
          question: "What problem does this project aim to solve?",
          answers: [
            { text: "Reduce material waste", correct: true },
            { text: "Improve user comfort", correct: false },
            { text: "Save storage space", correct: false }
          ],
        
          explanation: "Great job! You completed this project's challenge."
        }
      ]
    },

    project2: {
      title: "Project 02",
      model: document.getElementById("projectModel2"),
      target: document.getElementById("project2Target"),
      questions: [
        {
          question: "Who is the main user of this project?",
          answers: [
            { text: "Children", correct: true },
            { text: "Professional chefs", correct: false },
            { text: "Gardeners", correct: false }
          ],
         
          explanation: "Great job! You completed this project's challenge."
        }
      ]
    },

    project3: {
  title: "Project 03",
  model: document.getElementById("projectModel3"),
  target: document.getElementById("project3Target"),
  questions: [
    {
      question: "What is the main purpose of this project?",
      answers: [
        { text: "Improve everyday activities", correct: true },
        { text: "Create decoration", correct: false },
        { text: "Increase packaging", correct: false }
      ],
      explanation: "Great job! You completed this project's challenge."
    }
  ]
}
  };

  let currentProject = null;
  let currentQuestion = 0;
  let answered = false;

  // DISPLAY A QUESTION
  function showQuestion() {
    answered = false;

    const question =
      currentProject.questions[currentQuestion];

    progress.textContent =
      "QUESTION " + (currentQuestion + 1) +
      " OF " + currentProject.questions.length;

    questionText.textContent = question.question;
    answerContainer.innerHTML = "";
    feedback.textContent = "";
    nextButton.disabled = true;

    question.answers.forEach(function(answer) {
      const button = document.createElement("button");

      button.className = "answer";
      button.textContent = answer.text;

      button.addEventListener("click", function() {
        if (answered) return;

        answered = true;

        const allAnswers =
          answerContainer.querySelectorAll(".answer");

        allAnswers.forEach(function(item) {
          item.disabled = true;
        });

        if (answer.correct) {
          button.classList.add("correct");
          feedback.textContent = question.explanation;
          feedback.style.color = "green";
        } else {
          button.classList.add("incorrect");

          feedback.textContent =
            "Not quite! The correct answer is: " +
            question.answers.find(a => a.correct).text;

          feedback.style.color = "red";

          allAnswers.forEach(function(item, index) {
            if (question.answers[index].correct) {
              item.classList.add("correct");
            }
          });
        }

        nextButton.disabled = false;
      });

      answerContainer.appendChild(button);
    });

    nextButton.textContent =
      currentQuestion === currentProject.questions.length - 1
        ? "Finish"
        : "Continue";
  }

  // OPEN THE SELECTED PROJECT'S QUIZ
  function openQuiz(projectId) {
    if (overlay.style.display === "flex") return;

    currentProject = projects[projectId];
    currentQuestion = 0;

    quizTitle.textContent = currentProject.title;

    quizCard.style.display = "block";
    completionScreen.style.display = "none";
    overlay.style.display = "flex";

    showQuestion();
  }

  // CONTINUE OR FINISH
  nextButton.addEventListener("click", function() {
    if (!answered) return;

    if (currentQuestion < currentProject.questions.length - 1) {
      currentQuestion++;
      showQuestion();
    } else {
      quizCard.style.display = "none";
      completionScreen.style.display = "block";
    }
  });

  // CLOSE QUIZ
  function closeQuiz() {
    overlay.style.display = "none";
  }

  document.getElementById("closeQuiz")
    .addEventListener("click", closeQuiz);

  document.getElementById("finishButton")
    .addEventListener("click", closeQuiz);

  // REPLAY QUIZ
  document.getElementById("replayButton")
    .addEventListener("click", function() {
      currentQuestion = 0;

      completionScreen.style.display = "none";
      quizCard.style.display = "block";

      showQuestion();
    });

  // TAP DETECTION FOR BOTH PROJECTS
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  scene.addEventListener("renderstart", function() {
    const canvas = scene.renderer.domElement;

    canvas.addEventListener("pointerdown", function(event) {
      if (overlay.style.display === "flex") return;

      const rect = canvas.getBoundingClientRect();

      pointer.x =
        ((event.clientX - rect.left) / rect.width) * 2 - 1;

      pointer.y =
        -(((event.clientY - rect.top) / rect.height) * 2 - 1);

      raycaster.setFromCamera(pointer, scene.camera);

      // CHECK EACH PROJECT MODEL
      for (const projectId of Object.keys(projects)) {
        const project = projects[projectId];

        // Only check models whose marker is currently visible
        if (!project.target.object3D.visible) continue;

        const intersections = raycaster.intersectObject(
          project.model.object3D,
          true
        );

        if (intersections.length > 0) {
          openQuiz(projectId);
          break;
        }
      }
    });
  });
</script>
</body>
</html>
