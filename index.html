
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inventarium WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets/targets.mind;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera -->
   <a-camera
  position="0 0 0"
  look-controls="enabled: false"
  cursor="rayOrigin: mouse; fuse: false"
  raycaster="objects: .clickable">
</a-camera>

    <!-- Image target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Exhibition project 3D model -->
<a-entity
  id="projectModel"
  class="clickable"
  gltf-model="./assets/models/proyecto1.glb"
  position="0 0 0.3"
  rotation="0 0 0"
  scale="0.2 0.2 0.2"
  animation="
    property: rotation;
    to: 0 360 0;
    loop: true;
    dur: 8000">
</a-entity>

      <!-- Floating text -->
      <a-text
        value="Hello, Inventarium!"
        position="0 0.35 0.3"
        align="center"
        color="#FFFFFF"
        width="2">
      </a-text>

    </a-entity>

  </a-scene>
<script>
  const projectModel = document.querySelector("#projectModel");

  projectModel.addEventListener("click", function () {
    alert("You discovered a star!");
  });
</script>
</body>
</html>
